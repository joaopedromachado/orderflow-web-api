name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: orderflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orderflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      URL_DATABASE: jdbc:postgresql://localhost:5432/orderflow
      USERNAME_DB: postgres
      PASSWORD_DB: postgres

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate temporary JWT keys
        run: |
          mkdir -p src/main/resources/rsa
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out src/main/resources/rsa/server.key
          openssl pkey -in src/main/resources/rsa/server.key -pubout -out src/main/resources/rsa/app.pub

      - name: Build and test
        run: ./mvnw --batch-mode verify
