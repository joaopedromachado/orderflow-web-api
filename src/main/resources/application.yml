spring:
  application:
    name: orderflow
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${USERNAME_DB} # root
    password: ${PASSWORD_DB} # "123456"
    url: jdbc:postgresql://localhost:5432/orderflow_db
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org:
      flywaydb: DEBUG
      hibernate:
        sql: DEBUG

jwt:
  private:
    key: classpath:rsa/server.key
  public:
    key: classpath:rsa/app.pub

aws:
  region: sa-east-1
  bucket:
    name: orderflow-receipts-dev-057134387876-sa-east-1-an
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

reports:
  output-directory: ${REPORTS_OUTPUT_DIRECTORY:./reports/generated}
