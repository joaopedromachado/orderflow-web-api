spring:
  application:
    name: orderflow
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${USERNAME_DB}
    password: ${PASSWORD_DB}
    url: ${URL_DATABASE}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

flyway:
  baseline-on-migrate: true
  enabled: true
  locations: classpath:db/migration

logging:
  level:
    org:
      flywaydb: DEBUG
      hibernate:
        sql: DEBUG

jwt:
  private:
    key: classpath:rsa/server.key
  public:
    key: classpath:rsa/app.pub