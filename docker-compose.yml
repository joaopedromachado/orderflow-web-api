services:
  postgres:
    image: postgres:14.24-alpine3.23
    container_name: orderflow-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: orderflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orderflow-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  orderflow-network:
    name: orderflow-network
    external: true